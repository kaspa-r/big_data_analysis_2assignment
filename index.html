<!DOCTYPE html>
<html>
<head>
    <title>Stroke Prediction</title>
    <script>
        async function getRandomData() {
            try {
                const response = await fetch('/random_data');
                const data = await response.json();

                document.getElementById('gender').value = data.gender;
                document.getElementById('age').value = data.age;
                document.getElementById('hypertension').value = data.hypertension;
                document.getElementById('heart_disease').value = data.heart_disease;
                document.getElementById('ever_married').value = data.ever_married;
                document.getElementById('work_type').value = data.work_type;
                document.getElementById('residence_type').value = data.residence_type;
                document.getElementById('avg_glucose_level').value = data.avg_glucose_level;
                document.getElementById('bmi').value = data.bmi === 0 ? '' : data.bmi; // Handle potential 0 BMI
                document.getElementById('smoking_status').value = data.smoking_status;
            } catch (error) {
                console.error('Error fetching random data:', error);
                alert('Failed to fetch random data.');
            }
        }
    </script>
</head>
<body>
    <h1>Stroke Prediction</h1>

    <button type="button" onclick="getRandomData()">Random Data</button>

    <form method="POST">
        <div>
            <label for="age">Age:</label>
            <input type="number" id="age" name="age" required>
        </div>
        <div>
            <label for="hypertension">Hypertension (0 or 1):</label>
            <input type="number" id="hypertension" name="hypertension" min="0" max="1" required>
        </div>
        <div>
            <label for="heart_disease">Heart Disease (0 or 1):</label>
            <input type="number" id="heart_disease" name="heart_disease" min="0" max="1" required>
        </div>
        <div>
            <label for="gender">Gender (0 or 1):</label>
            <input type="number" id="gender" name="gender" min="0" max="1" required>
        </div>
        <div>
            <label for="ever_married">Ever Married (0 or 1):</label>
            <input type="number" id="ever_married" name="ever_married" min="0" max="1" required>
        </div>
        <div>
            <label for="work_type">Work Type:</label>
            <select id="work_type" name="work_type" required>
                <option value="">Select Work Type</option>
                <option value="Private">Private</option>
                <option value="Self-employed">Self-employed</option>
                <option value="Govt_job">Govt_job</option>
                <option value="Never_worked">Never_worked</option>
                <option value="children">children</option>
            </select>
        </div>
        <div>
            <label for="residence_type">Residence Type (0 or 1):</label>
            <input type="number" id="residence_type" name="residence_type" min="0" max="1" required>
        </div>
        <div>
            <label for="avg_glucose_level">Average Glucose Level (55-272):</label>
            <input type="number" step="any" id="avg_glucose_level" name="avg_glucose_level" required>
        </div>
        <div>
            <label for="bmi">BMI (10-80):</label>
            <input type="number" step="any" id="bmi" name="bmi">
        </div>
        <div>
            <label for="smoking_status">Smoking Status:</label>
            <select id="smoking_status" name="smoking_status" required>
                <option value="">Select Smoking status</option>
                <option value="Unknown">Unknown</option>
                <option value="formerly smoked">formerly smoked</option>
                <option value="smokes">smokes</option>
                <option value="never smoked">never smoked</option>
            </select>
        </div>

        <div>
            <label for="model_select">Select Predictive Model:</label>
            <select name="model_select" id="model_select">
                <option value="GradientBoostingClassifier">model_GBC</option>
                <option value="LGBMClassifier">model_LGBM</option>
                <option value="XGBoostClassifier">model_XGB</option>
            </select>
        </div>

        <button type="submit">Predict</button>
    </form>

    {% if result %}
    <h2>Prediction Result:</h2>
    <p>The selected model ({{ selected_model }}) predicts: <strong>{{ result }}</strong></p>
    {% endif %}

    {% if error %}
        <p style="color: red;">Error: {{ error }}</p>
    {% endif %}

    </body>
</html>
